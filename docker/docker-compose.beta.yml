name: receitasgc-beta

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-../deploy/env/beta.env}
    environment:
      PGHOST: 127.0.0.1
      PGPORT: 5432
    ports:
      - "${APP_PORT:-3001}:3000"
    volumes:
      - beta_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  beta_pg_data:
