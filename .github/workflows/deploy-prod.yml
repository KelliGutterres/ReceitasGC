name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch para deploy
        required: false
        default: main
      confirm:
        description: Digite DEPLOY para confirmar produção
        required: true
        default: ""

jobs:
  deploy:
    name: Deploy para Produção (self-hosted)
    runs-on: self-hosted
    environment: production

    steps:
      - name: Confirmar deploy em produção
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Deploy em produção cancelado. Digite DEPLOY no campo de confirmação."
            exit 1
          fi

      - name: Deploy na VM (runner local)
        env:
          REPO_DIR: ${{ vars.VM_REPO_DIR || '/opt/receitasgc/ReceitasGC' }}
          DOCKER_SUDO: "1"
        run: |
          if [ ! -f "${REPO_DIR}/scripts/deploy/deploy.sh" ]; then
            echo "::error::Repositório não encontrado em ${REPO_DIR}. Clone o projeto na VM antes do deploy."
            exit 1
          fi
          bash "${REPO_DIR}/scripts/deploy/deploy.sh" prod "${{ github.event.inputs.branch || 'main' }}"

      - name: Resumo
        env:
          VM_PUBLIC_HOST: ${{ vars.VM_PUBLIC_HOST || '177.44.248.35' }}
        run: |
          echo "### Deploy Produção concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner:** self-hosted (VM)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.event.inputs.branch || 'main' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** http://${VM_PUBLIC_HOST}:3000/login" >> "$GITHUB_STEP_SUMMARY"
